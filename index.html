<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบประกาศเสียงภาษาพม่า (Secure)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; transition: background-color 0.5s; }
        .glass-panel { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); transition: all 0.3s ease; }
        .hidden-view { display: none !important; }
        input:checked ~ .toggle-bg { background-color: #3b82f6; }
        input:checked ~ .toggle-dot { transform: translateX(100%); }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen flex items-center justify-center p-4" id="mainBody">
    
    <!-- 1. LOGIN SCREEN (Removed default password text) -->
    <div class="glass-panel rounded-2xl shadow-xl w-full max-w-sm overflow-hidden relative" id="loginScreen">
        <div class="bg-blue-600 p-6 text-center text-white">
            <h2 class="text-2xl font-bold">เข้าสู่ระบบ</h2>
            <p class="text-sm text-blue-200 mt-1">วุ้นแปลภาษาพม่า</p>
        </div>
        <div class="p-6 space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">ชื่อผู้ใช้ (Username)</label>
                <input type="text" id="username" class="w-full px-3 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">รหัสผ่าน (Password)</label>
                <input type="password" id="password" class="w-full px-3 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none" onkeypress="if(event.key==='Enter') login()">
            </div>
            <button onclick="login()" id="loginBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg shadow-md transition-colors">
                เข้าสู่ระบบ
            </button>
            <p id="loginError" class="text-red-500 text-sm text-center hidden-view">รหัสผ่านไม่ถูกต้อง!</p>
        </div>
    </div>

    <!-- 2. MAIN APP SCREEN -->
    <div class="glass-panel rounded-2xl shadow-xl w-full max-w-lg overflow-hidden relative hidden-view" id="appScreen">
        <div class="bg-blue-600 p-4 flex justify-between items-center text-white">
            <h2 class="text-xl font-semibold flex items-center gap-2">
                <span class="relative flex h-3 w-3"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span><span class="relative inline-flex rounded-full h-3 w-3 bg-green-500"></span></span>
                วุ้นแปลภาษาพม่า
            </h2>
            <div class="flex gap-2">
                <button id="adminBtn" onclick="openAdmin()" class="hidden-view bg-indigo-500 hover:bg-indigo-600 px-3 py-1.5 rounded-lg text-sm font-medium transition shadow-sm">จัดการ (Admin)</button>
                <button onclick="logout()" class="bg-red-500 hover:bg-red-600 px-3 py-1.5 rounded-lg text-sm font-medium transition shadow-sm">ออกระบบ</button>
            </div>
        </div>
        
        <div class="p-6 space-y-4">
            <div>
                <div class="flex justify-between items-end mb-2">
                    <label class="block text-sm font-medium text-gray-700">พิมพ์ข้อความภาษาไทย</label>
                    <label class="flex items-center cursor-pointer">
                      <div class="relative">
                        <input type="checkbox" id="realtimeToggle" class="sr-only">
                        <div class="block bg-gray-300 w-10 h-6 rounded-full toggle-bg"></div>
                        <div class="dot absolute left-1 top-1 bg-white w-4 h-4 rounded-full transition toggle-dot"></div>
                      </div>
                      <span class="ml-2 text-xs text-gray-600 font-medium">Real-Time</span>
                    </label>
                </div>
                <textarea id="textInput" rows="3" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors resize-none shadow-sm" placeholder="พิมพ์ข้อความ..."></textarea>
            </div>
            
            <div class="grid grid-cols-2 gap-3 bg-gray-50 p-3 rounded-lg border border-gray-200">
                <div>
                    <label class="block text-xs font-medium text-gray-700 mb-1">ผู้พูด (เสียง)</label>
                    <select id="voiceSelect" class="w-full px-2 py-1.5 rounded-md border border-gray-300 focus:ring-2 focus:ring-blue-500 bg-white shadow-sm text-xs" onchange="triggerTranslate()">
                        <option value="my-MM-NilarNeural">หญิง (Nilar)</option>
                        <option value="my-MM-ThihaNeural">ชาย (Thiha)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-700 mb-1">โทนเสียงจำลองวัย</label>
                    <select id="pitchSelect" class="w-full px-2 py-1.5 rounded-md border border-gray-300 focus:ring-2 focus:ring-blue-500 bg-white shadow-sm text-xs" onchange="triggerTranslate()">
                        <option value="+20Hz">โทนเสียงเด็ก (แหลม)</option>
                        <option value="+0Hz">วัยทำงาน (ปกติ)</option>
                        <option value="-15Hz">ผู้สูงอายุ (ทุ้ม)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-700 mb-1">ความเร็วเสียง</label>
                    <select id="rateSelect" class="w-full px-2 py-1.5 rounded-md border border-gray-300 focus:ring-2 focus:ring-blue-500 bg-white shadow-sm text-xs" onchange="triggerTranslate()">
                        <option value="+0%">ปกติ (ช้า)</option>
                        <option value="+15%">+15% (แนะนำ)</option>
                        <option value="+25%">+25% (เร็ว)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-700 mb-1">ช่องทางแปลภาษา</label>
                    <select id="engineSelect" class="w-full px-2 py-1.5 rounded-md border border-gray-300 focus:ring-2 focus:ring-blue-500 bg-white shadow-sm text-xs" onchange="triggerTranslate()">
                        <option value="auto">อัตโนมัติ</option>
                        <option value="google">Google</option>
                        <option value="mymemory">MyMemory</option>
                    </select>
                </div>
            </div>

            <button id="speakBtn" onclick="translateAndSpeak()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-4 rounded-lg shadow-md transition-colors">แปลและเล่นเสียง</button>
            <div id="loadingDiv" class="hidden-view text-center text-blue-600 font-medium py-2 text-sm">กำลังประมวลผล...</div>
            
            <div id="resultBox" class="hidden-view bg-green-50 rounded-lg p-4 border border-green-200">
                <div class="flex justify-between items-center mb-1">
                    <p class="text-xs text-green-600 font-bold uppercase">คำแปล (พม่า)</p>
                    <span id="engineBadge" class="bg-green-200 text-green-800 text-[10px] px-2 py-0.5 rounded-full font-semibold"></span>
                </div>
                <p id="resultText" class="text-lg text-gray-800 font-medium mb-3"></p>
                <audio id="audioPlayer" controls class="w-full h-8 outline-none mb-3"></audio>
                <div class="flex items-center gap-2">
                    <select id="formatSelect" class="w-1/3 px-2 py-2 rounded-lg border border-gray-300 bg-white shadow-sm text-xs">
                        <option value="mp3">MP3</option>
                        <option value="wav">WAV</option>
                        <option value="ogg">OGG</option>
                    </select>
                    <a id="downloadBtn" href="#" onclick="updateDownloadLink(event)" class="w-2/3 bg-green-600 hover:bg-green-700 text-white font-medium py-2 px-2 rounded-lg shadow-sm transition-colors flex items-center justify-center text-xs">
                        ดาวน์โหลด
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- 3. ADMIN MODAL (Added Tab for User Management) -->
    <div id="adminModal" class="fixed inset-0 bg-black bg-opacity-50 hidden-view flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm overflow-hidden flex flex-col max-h-[90vh]">
            <div class="bg-indigo-600 p-4 text-white flex justify-between items-center shrink-0">
                <h2 class="font-bold">จัดการระบบ (Admin)</h2>
                <button onclick="closeAdmin()" class="text-white hover:text-gray-200 font-bold text-xl">&times;</button>
            </div>
            
            <div class="flex border-b text-sm shrink-0">
                <button id="tabSettingsBtn" onclick="switchAdminTab('settings')" class="flex-1 py-2 font-bold text-indigo-600 border-b-2 border-indigo-600">ตั้งค่าเริ่มต้น</button>
                <button id="tabUsersBtn" onclick="switchAdminTab('users')" class="flex-1 py-2 font-bold text-gray-500 hover:text-indigo-600">จัดการผู้ใช้</button>
            </div>

            <div class="p-4 overflow-y-auto flex-1">
                <!-- Tab: Settings -->
                <div id="tabSettings" class="space-y-3">
                    <p class="text-xs text-gray-500 mb-2">ตั้งค่าเริ่มต้นที่จะแสดงให้ผู้ใช้งานเห็น</p>
                    
                    <label class="block text-xs font-medium">Engine เริ่มต้น</label>
                    <select id="setEngine" class="w-full border rounded p-1.5 text-sm mb-2">
                        <option value="auto">อัตโนมัติ</option><option value="google">Google</option><option value="mymemory">MyMemory</option>
                    </select>

                    <label class="block text-xs font-medium">เสียงผู้พูดเริ่มต้น</label>
                    <select id="setVoice" class="w-full border rounded p-1.5 text-sm mb-2">
                        <option value="my-MM-NilarNeural">หญิง</option><option value="my-MM-ThihaNeural">ชาย</option>
                    </select>

                    <label class="block text-xs font-medium">โทนเสียงเริ่มต้น</label>
                    <select id="setPitch" class="w-full border rounded p-1.5 text-sm mb-2">
                        <option value="+20Hz">เด็ก</option><option value="+0Hz">ทำงาน</option><option value="-15Hz">คนแก่</option>
                    </select>

                    <label class="block text-xs font-medium">ความเร็วเริ่มต้น</label>
                    <select id="setRate" class="w-full border rounded p-1.5 text-sm mb-2">
                        <option value="+0%">ปกติ</option><option value="+15%">+15%</option><option value="+25%">+25%</option>
                    </select>

                    <label class="block text-xs font-medium">ฟอร์แมตเริ่มต้น</label>
                    <select id="setFormat" class="w-full border rounded p-1.5 text-sm mb-2">
                        <option value="mp3">MP3</option><option value="wav">WAV</option><option value="ogg">OGG</option>
                    </select>

                    <button onclick="saveAdminSettings()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded-lg mt-4 text-sm font-bold">บันทึกการตั้งค่า</button>
                </div>

                <!-- Tab: Users -->
                <div id="tabUsers" class="hidden-view space-y-4">
                    <div class="bg-gray-50 p-3 rounded border">
                        <h3 class="text-xs font-bold text-gray-700 mb-2">เพิ่มผู้ใช้งานใหม่</h3>
                        <div class="flex gap-2 mb-2">
                            <input type="text" id="newUsername" placeholder="ชื่อบัญชี (User)" class="flex-1 border rounded px-2 py-1 text-sm outline-none">
                            <input type="password" id="newPassword" placeholder="รหัสผ่าน" class="flex-1 border rounded px-2 py-1 text-sm outline-none">
                        </div>
                        <select id="newRole" class="w-full border rounded px-2 py-1 text-sm mb-2 outline-none">
                            <option value="user">ผู้ใช้ทั่วไป (ใช้งานได้อย่างเดียว)</option>
                            <option value="admin">แอดมิน (ตั้งค่าและเพิ่มคนได้)</option>
                        </select>
                        <button onclick="createUser()" class="w-full bg-green-600 hover:bg-green-700 text-white py-1.5 rounded text-sm font-bold shadow-sm">เพิ่มบัญชีผู้ใช้</button>
                    </div>
                    
                    <div>
                        <h3 class="text-xs font-bold text-gray-700 mb-2">รายชื่อผู้ใช้งานในระบบ</h3>
                        <div class="border rounded overflow-y-auto" style="max-height: 150px;">
                            <table class="w-full text-sm text-left">
                                <thead class="bg-gray-100 sticky top-0">
                                    <tr><th class="p-2">ชื่อบัญชี</th><th class="p-2">สิทธิ์</th><th class="p-2 text-right">จัดการ</th></tr>
                                </thead>
                                <tbody id="usersListTable">
                                    <!-- Dynamic Rows -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let typingTimer;                
        const doneTypingInterval = 2000; 
        
        // --- AUTH LOGIC ---
        window.onload = () => {
            const token = localStorage.getItem("app_token");
            if (token) {
                loadSettingsAndShowApp(token);
            } else {
                document.getElementById("loginScreen").classList.remove("hidden-view");
            }
        };

        async function login() {
            const u = document.getElementById("username").value;
            const p = document.getElementById("password").value;
            const btn = document.getElementById("loginBtn");
            const err = document.getElementById("loginError");
            
            btn.innerText = "กำลังตรวจสอบ...";
            err.classList.add("hidden-view");

            const fd = new FormData(); fd.append("username", u); fd.append("password", p);
            
            try {
                const res = await fetch("/login", { method: "POST", body: fd });
                if (res.ok) {
                    const data = await res.json();
                    localStorage.setItem("app_token", data.access_token);
                    localStorage.setItem("app_role", data.role);
                    loadSettingsAndShowApp(data.access_token);
                } else {
                    err.classList.remove("hidden-view");
                }
            } catch(e) { err.innerText="การเชื่อมต่อผิดพลาด"; err.classList.remove("hidden-view"); }
            btn.innerText = "เข้าสู่ระบบ";
        }

        function logout() {
            localStorage.removeItem("app_token");
            localStorage.removeItem("app_role");
            window.location.reload();
        }

        // --- APP LOGIC ---
        async function loadSettingsAndShowApp(token) {
            document.getElementById("loginScreen").classList.add("hidden-view");
            document.getElementById("appScreen").classList.remove("hidden-view");
            
            if(localStorage.getItem("app_role") === "admin") {
                document.getElementById("adminBtn").classList.remove("hidden-view");
            }

            try {
                const res = await fetch("/api/settings", { headers: { "Authorization": `Bearer ${token}` } });
                if(res.ok) {
                    const settings = await res.json();
                    document.getElementById('engineSelect').value = settings.default_engine;
                    document.getElementById('voiceSelect').value = settings.default_voice;
                    document.getElementById('rateSelect').value = settings.default_rate;
                    document.getElementById('pitchSelect').value = settings.default_pitch;
                    document.getElementById('formatSelect').value = settings.default_format;
                } else if(res.status === 401) { logout(); }
            } catch(e) {}
        }

        document.getElementById('textInput').addEventListener('keyup', () => {
            clearTimeout(typingTimer);
            if (document.getElementById('textInput').value.trim() && document.getElementById('realtimeToggle').checked) {
                typingTimer = setTimeout(translateAndSpeak, doneTypingInterval);
            }
        });
        document.getElementById('textInput').addEventListener('keydown', () => { clearTimeout(typingTimer); });
        function triggerTranslate() { if(document.getElementById('textInput').value.trim() && document.getElementById('realtimeToggle').checked) translateAndSpeak(); }

        function updateDownloadLink(event) {
            const format = document.getElementById('formatSelect').value;
            const btn = document.getElementById('downloadBtn');
            if(btn.href && btn.href.includes('/download?fmt=')) {
                btn.href = btn.href.split('?')[0] + '?fmt=' + format;
                btn.download = `burmese_audio.${format}`;
            }
        }

        async function translateAndSpeak() {
            const token = localStorage.getItem("app_token");
            if(!token) { logout(); return; }

            const text = document.getElementById('textInput').value.trim();
            if(!text) return; 

            document.getElementById('resultBox').classList.add('hidden-view');
            document.getElementById('loadingDiv').classList.remove('hidden-view');
            document.getElementById('speakBtn').disabled = true; 

            try {
                const fd = new FormData();
                fd.append("text", text);
                fd.append("rate", document.getElementById('rateSelect').value);
                fd.append("pitch", document.getElementById('pitchSelect').value);
                fd.append("voice", document.getElementById('voiceSelect').value);
                fd.append("audio_format", document.getElementById('formatSelect').value);
                fd.append("engine", document.getElementById('engineSelect').value);

                const res = await fetch("/process", { 
                    method: "POST", 
                    body: fd,
                    headers: { "Authorization": `Bearer ${token}` }
                });
                
                if(res.status === 401) { alert("Session หมดอายุ กรุณาล็อกอินใหม่"); logout(); return; }
                
                const data = await res.json();
                if(data.error) { alert(data.error); return; }

                document.getElementById('resultText').innerText = data.burmese_text;
                document.getElementById('engineBadge').innerText = "via " + data.engine_used;
                document.getElementById('audioPlayer').src = data.play_url + "&t=" + new Date().getTime();
                
                const btn = document.getElementById('downloadBtn');
                btn.href = data.download_url;
                btn.download = `burmese_audio.${document.getElementById('formatSelect').value}`;
                
                document.getElementById('loadingDiv').classList.add('hidden-view');
                document.getElementById('resultBox').classList.remove('hidden-view');
                document.getElementById('audioPlayer').play().catch(e=>{});
            } catch (error) { alert("เกิดข้อผิดพลาดเครือข่าย"); } finally {
                document.getElementById('speakBtn').disabled = false;
                document.getElementById('loadingDiv').classList.add('hidden-view');
            }
        }

        // --- ADMIN SETTINGS & USERS ---
        function switchAdminTab(tab) {
            if(tab === 'settings') {
                document.getElementById('tabSettings').classList.remove('hidden-view');
                document.getElementById('tabUsers').classList.add('hidden-view');
                document.getElementById('tabSettingsBtn').className = "flex-1 py-2 font-bold text-indigo-600 border-b-2 border-indigo-600";
                document.getElementById('tabUsersBtn').className = "flex-1 py-2 font-bold text-gray-500 hover:text-indigo-600";
            } else {
                document.getElementById('tabSettings').classList.add('hidden-view');
                document.getElementById('tabUsers').classList.remove('hidden-view');
                document.getElementById('tabSettingsBtn').className = "flex-1 py-2 font-bold text-gray-500 hover:text-indigo-600";
                document.getElementById('tabUsersBtn').className = "flex-1 py-2 font-bold text-indigo-600 border-b-2 border-indigo-600";
                loadUsers();
            }
        }

        function openAdmin() {
            document.getElementById("setEngine").value = document.getElementById('engineSelect').value;
            document.getElementById("setVoice").value = document.getElementById('voiceSelect').value;
            document.getElementById("setPitch").value = document.getElementById('pitchSelect').value;
            document.getElementById("setRate").value = document.getElementById('rateSelect').value;
            document.getElementById("setFormat").value = document.getElementById('formatSelect').value;
            switchAdminTab('settings');
            document.getElementById("adminModal").classList.remove("hidden-view");
        }
        function closeAdmin() { document.getElementById("adminModal").classList.add("hidden-view"); }
        
        async function saveAdminSettings() {
            const token = localStorage.getItem("app_token");
            const fd = new FormData();
            fd.append("default_engine", document.getElementById("setEngine").value);
            fd.append("default_voice", document.getElementById("setVoice").value);
            fd.append("default_pitch", document.getElementById("setPitch").value);
            fd.append("default_rate", document.getElementById("setRate").value);
            fd.append("default_format", document.getElementById("setFormat").value);

            try {
                const res = await fetch("/api/settings", {
                    method: "POST", body: fd, headers: { "Authorization": `Bearer ${token}` }
                });
                if(res.ok) {
                    alert("บันทึกการตั้งค่าสำเร็จ! ผู้ใช้ใหม่จะเห็นค่าเริ่มต้นนี้");
                    closeAdmin();
                    loadSettingsAndShowApp(token);
                } else { alert("เกิดข้อผิดพลาดในการบันทึก"); }
            } catch(e) { alert("เชื่อมต่อล้มเหลว"); }
        }

        async function loadUsers() {
            const token = localStorage.getItem("app_token");
            try {
                const res = await fetch("/api/users", { headers: { "Authorization": `Bearer ${token}` } });
                if(res.ok) {
                    const users = await res.json();
                    const tbody = document.getElementById('usersListTable');
                    tbody.innerHTML = "";
                    users.forEach(u => {
                        const tr = document.createElement('tr');
                        tr.className = "border-t";
                        const roleLabel = u.role === 'admin' ? '<span class="text-xs text-red-500 font-bold">Admin</span>' : '<span class="text-xs text-blue-500 font-bold">User</span>';
                        tr.innerHTML = `
                            <td class="p-2">${u.username}</td>
                            <td class="p-2">${roleLabel}</td>
                            <td class="p-2 text-right">
                                ${u.username !== 'admin' ? `<button onclick="deleteUser(${u.id})" class="text-red-500 hover:text-red-700 text-xs font-bold px-2 py-1 bg-red-50 rounded">ลบ</button>` : ''}
                            </td>
                        `;
                        tbody.appendChild(tr);
                    });
                }
            } catch(e) {}
        }

        async function createUser() {
            const token = localStorage.getItem("app_token");
            const u = document.getElementById("newUsername").value.trim();
            const p = document.getElementById("newPassword").value.trim();
            const r = document.getElementById("newRole").value;
            if(!u || !p) { alert("กรุณากรอกชื่อผู้ใช้และรหัสผ่าน"); return; }
            
            const fd = new FormData();
            fd.append("username", u); fd.append("password", p); fd.append("role", r);
            
            try {
                const res = await fetch("/api/users", {
                    method: "POST", body: fd, headers: { "Authorization": `Bearer ${token}` }
                });
                if(res.ok) {
                    document.getElementById("newUsername").value = "";
                    document.getElementById("newPassword").value = "";
                    loadUsers();
                } else {
                    const data = await res.json();
                    alert(data.detail || "ไม่สามารถเพิ่มผู้ใช้ได้");
                }
            } catch(e) { alert("เกิดข้อผิดพลาด"); }
        }

        async function deleteUser(id) {
            if(!confirm("ยืนยันการลบบัญชีผู้ใช้นี้?")) return;
            const token = localStorage.getItem("app_token");
            try {
                const res = await fetch(`/api/users/${id}`, {
                    method: "DELETE", headers: { "Authorization": `Bearer ${token}` }
                });
                if(res.ok) {
                    loadUsers();
                } else {
                    const data = await res.json();
                    alert(data.detail || "ลบผู้ใช้งานไม่สำเร็จ");
                }
            } catch(e) {}
        }
    </script>
</body>
</html>
